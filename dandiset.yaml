releaseNotes: "## Changes since version 0.250624.0419\n\nAll 22 files were re-converted
  from the lab's source files with a new conversion (NeuroConv; code in [catalystneuro/buzsaki-lab-to-nwb](https://github.com/catalystneuro/buzsaki-lab-to-nwb),
  pull requests [#85](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/85)
  and [#86](https://github.com/catalystneuro/buzsaki-lab-to-nwb/pull/86)), fixing
  problems found by a reproduction attempt ([issue #75](https://github.com/catalystneuro/buzsaki-lab-to-nwb/issues/75)).\n
  \n**Corrections**\n\n- **Units.** The earlier conversion dropped the highest-numbered
  cluster on every shank that has a multi-unit cluster, and then attached cell type,
  region and global id by position, so after the first dropped cluster those labels
  belonged to other units (for example, BWRat17_121912 has 35 units, not 29, and its
  one inhibitory unit was among those dropped). Units are now read from the `.clu`/`.res`
  files (clusters 2 and up) and matched to the lab's cell classification by shank
  and cluster.\n- **Dino_072114 spike times** were seconds divided by 20,000; they
  are now in seconds. The 5 units of its shank 7 are left out, because the lab's two
  sources of their spike times disagree and neither can be confirmed (the reason is
  in the units table description).\n- **Gain.** The LFP was stored with a scaling
  of NaN and the spike waveforms with 1.0. Both are now scaled to volts with 0.3815
  µV per step, the `voltsperunit` of the lab's `_BasicMetaData.mat` files.\n- **Spike
  waveforms** were stored as (spikes, samples, channels); they are now (spikes, channels,
  samples), as NWB requires.\n- **Dino_061914 has no LFP.** Its earlier LFP had been
  reshaped to 125 channels of a 128-channel recording, which scrambled the samples.
  The lab's source file does not divide into whole channels, so its channel count
  is a question for the lab.\n\n**Additions**\n\n- Units have `shank` and `cluster_id`
  columns, links to their electrode group and electrodes, and a spike time resolution
  of 1/20,000 s; electrodes have a `channel_id` column, the channel's number in the
  lab's files.\n- Ontology terms (HERD, in `/general/external_resources`) for the
  species, sex, electrode locations (anterior cingulate, medial prefrontal, orbitofrontal
  and secondary motor cortex), unit region and cell types.\n- Descriptions of the
  sleep-state table, the unit columns and the LFP phase series; subject strain, sex
  and an ISO 8601 age range; the paper's DOI.\n- Datasets are chunked for streaming
  (chunks of about 32 MB).\n\n**Other changes**\n\n- Sleep states moved from `processing/behavior/states`
  to `processing/behavior/sleep_states`.\n- The LFP phase decompositions were recomputed
  from the LFP with the same filter and Hilbert transform as before."
